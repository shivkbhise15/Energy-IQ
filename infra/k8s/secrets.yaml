apiVersion: v1
kind: Secret
metadata:
  name: energyiq-secrets
  namespace: energyiq
type: Opaque
stringData:
  DATABASE_URL: postgresql://energyiq:energyiq@postgres:5432/energyiq?schema=public
  JWT_ACCESS_SECRET: replace-with-kms-or-sealed-secret
  JWT_REFRESH_SECRET: replace-with-kms-or-sealed-secret
  POSTGRES_USER: energyiq
  POSTGRES_PASSWORD: energyiq
  POSTGRES_DB: energyiq
